base:
  - ../base/lotus.yaml
  - common.yaml
name: gsm-distill-3b-looped-1b-seed0
model_id: meta-llama/Llama-3.2-1B-Instruct
load_model_path: yingfanbot/gsm-cot-llama1b
teacher_model_id: meta-llama/Llama-3.2-3B-Instruct
teacher_tokenizer_id: meta-llama/Llama-3.2-3B-Instruct
teacher_model_path: yingfanbot/gsm-cot-llama3b
require_smaller_student: true
codi_alignment: relative_depth
codi_loss_weight: 1.0
student_cot_loss_weight: 0.1
main_answer_only: true
# Final stage removes ALL CoT, even for examples with more than six steps.
# The frozen teacher still sees the complete explicit rationale.
replace_all_cot_at_max_stage: true
epochs_per_stage: 1
max_latent_stage: 6
c_thought: 25
max_c_thought: 25
fixed_latent_tokens: 0
single_latent_token: false
auto_c_thought: false
intermediate_loss_weight: 0.0
cumulative_stages: false
uniform_prob: 0.0
